name: Daily Zendesk to Gemini Sync

on:
  schedule:
    # run every day at 12 AM
    - cron: '0 0 * * *'
  workflow_dispatch:
    # allow run manual

jobs:
  sync:
    runs-on: ubuntu-latest

    # need write permission to commit metadata back
    permissions:
      contents: write

    steps:
      # step 1: get code
      - name: Checkout repository
        uses: actions/checkout@v4

      # step 2: setup docker build tool
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # step 3: build docker image
      - name: Build Docker Image
        run: |
          docker build -t optibot-sync .

      # step 4: run container with api key env and data folder
      - name: Run sync script in Docker
        run: |
          docker run --env GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" -v "$(pwd)/data:/app/data" optibot-sync

      # step 5: save changes back to github repo
      - name: Commit and push sync state updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f data/metadata.json
          git commit -m "chore: update sync metadata [skip ci]" || echo "No changes to commit"
          git push
